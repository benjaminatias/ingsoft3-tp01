server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # La SPA no utiliza React Router, pero cualquier ruta desconocida
    # debe seguir devolviendo index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas a la API se redirigen al backend dentro de la red de Docker.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck del backend, útil para comprobaciones desde el navegador.
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }
}
