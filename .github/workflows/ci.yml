name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: solo este job puede escribir paquetes (publicar la imagen).
    permissions:
      contents: read
      packages: write
    # PostgreSQL descartable, solo para esta corrida: sin base de datos los tests de
    # integración (películas y géneros) se omiten y la cobertura queda muy por debajo.
    # La clave no es un secreto real: la base nace y muere con el runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: peliculas_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: clave-solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # deja la imagen en el Docker local para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        # --network host: el contenedor ve el PostgreSQL del servicio en localhost:5432.
        # El umbral vive en el ENTRYPOINT (backend/scripts/cobertura.sh): si la cobertura
        # no llega, el contenedor sale con error y este paso falla.
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_USER=postgres -e DB_PASSWORD=clave-solo-para-ci -e DB_NAME=peliculas_db \
            -e JWT_SECRET=clave-jwt-solo-para-ci \
            -e COVERAGE_DIR=/out \
            -v "${{ github.workspace }}/TestResults:/out" \
            backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          test -f TestResults/resumen.md   # si no está, el paso FALLA: mejor rojo que un resumen vacío
          cat TestResults/resumen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: TestResults

      # Desde acá hacia abajo, los pasos NO llevan `!cancelled()` ni `always()`: si un paso
      # anterior falló (tests en rojo, cobertura bajo el umbral), el job muere antes de llegar.
      # La condición de «publicar solo lo verificado» no está escrita: está en el ORDEN.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        # Los thresholds de vitest (vite.config.js) hacen que el contenedor salga con
        # error si la cobertura no llega, aunque todos los tests estén en verde.
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ───────────────────────────── CD: la promoción ─────────────────────────────
  # Cadena de compuertas:  PR verde → merge a main → (build-backend + build-frontend) → QA
  #                        → smoke verde → aprobación humana → PROD.
  # Los PRs verifican, solo main despliega. El `if` está acá y PROD lo hereda por `needs`.

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]      # sin CI verde no hay deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: qa                             # automático a propósito: sin reviewers
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner (para el script del smoke)
        uses: actions/checkout@v6

      # Desde el TP7 el hook ya no dice «qué commit construir» sino «QUÉ IMAGEN ejecutar»:
      # Render no compila nada, baja del registry la imagen que ESTA corrida publicó.
      # Por eso se saca el `&ref=`: con una imagen no hay nada que construir.
      # --get --data-urlencode agrega imgURL a la URL del hook (que ya trae ?key=…) con '&' y le
      # codifica los ':' y '/'. La URL del hook va ÚLTIMA: es el único argumento suelto.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test de QA (con reintentos)
        run: bash scripts/smoke.sh https://peliculas-api-qa.onrender.com https://peliculas-front-qa.onrender.com

  # ───────────── El gate de promoción: las pruebas contra QA decide si hay PROD ─────────────
  # Cadena: deploy-qa → integracion → e2e → deploy-prod (con aprobación humana).
  # Nada de este tramo lleva continue-on-error, `|| true`, `exit 0` ni `if: always()`: solo los
  # pasos que PUBLICAN el reporte o el resumen llevan `!cancelled()`, porque el reporte importa
  # más cuando falla.

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                        # QA ya está ejecutando la imagen de ESTA corrida
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar (sin browser)
        run: npm ci                         # sin `playwright install`: estas pruebas no abren navegador
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://peliculas-api-qa.onrender.com    # la API de QA (la api, no el front)
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Resumen de la integración
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const s = require('./playwright-results.json').stats;
            console.log('### Integración contra la api de QA');
            console.log('- ' + s.expected + ' passed · ' + s.unexpected + ' failed · ' + s.flaky + ' flaky · ' + s.skipped + ' skipped');
          " >> "$GITHUB_STEP_SUMMARY"
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                      # si la api está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://peliculas-front-qa.onrender.com   # el front de QA
        run: npx playwright test e2e/peliculas.spec.js            # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Resumen de las e2e
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const s = require('./playwright-results.json').stats;
            console.log('### e2e contra QA');
            console.log('- ' + s.expected + ' passed · ' + s.unexpected + ' failed · ' + s.flaky + ' flaky · ' + s.skipped + ' skipped');
          " >> "$GITHUB_STEP_SUMMARY"
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}                # el reporte importa MÁS cuando falla (y no cuando cancelás)
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                  # EL gate: sin e2e verde, ni siquiera se pide aprobación
    environment: production                     # el workflow SE PAUSA acá hasta que alguien apruebe
    permissions:
      contents: read
    # Dos deploys a PROD nunca se pisan. (No ordena la cola de aprobaciones: si quedan dos
    # corridas esperando, la vieja se rechaza a mano.)
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Bajar el código al runner (para el script del smoke)
        uses: actions/checkout@v6

      # Entre que la corrida queda esperando y que alguien aprueba pueden pasar horas y `main`
      # se mueve. El imgURL lleva el sha de ESTA corrida: se aprueba una imagen y se despliega
      # esa imagen, la MISMA que QA ejecutó y verificó (no se reconstruye nada).
      - name: Desplegar en PROD la MISMA imagen que QA (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test de PROD (con reintentos)
        run: bash scripts/smoke.sh https://peliculas-api-prod.onrender.com https://peliculas-front-prod.onrender.com
